<div class="card shadow-sm border-0 mb-4">

    <div class="card-header bg-white">

        <h5 class="mb-0">
            Filter Records
        </h5>

    </div>

    <div class="card-body">

        <form method="GET">

            <!-- First row of filters -->
            <div class="row">

                <!-- State -->
                <div class="col-lg-3 col-md-6 mb-3">

                    <label
                        for="state-select"
                        class="form-label"
                    >
                        State
                    </label>

                    <select
                        id="state-select"
                        name="state"
                        class="form-select"
                    >

                        <option value="">
                            All States
                        </option>

                        {% for state in states %}

                        <option
                            value="{{ state }}"
                            {% if request.args.get("state") == state %}
                                selected
                            {% endif %}
                        >
                            {{ state }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- LGA -->
                <div class="col-lg-3 col-md-6 mb-3">

                    <label
                        for="lga-select"
                        class="form-label"
                    >
                        Local Government Area
                    </label>

                    <select
                        id="lga-select"
                        name="lga"
                        class="form-select"
                        {% if not request.args.get("state") %}
                            disabled
                        {% endif %}
                    >

                        {% if request.args.get("state") %}

                            <option value="">
                                All LGAs
                            </option>

                            {% for lga in lgas %}

                            <option
                                value="{{ lga }}"
                                {% if request.args.get("lga") == lga %}
                                    selected
                                {% endif %}
                            >
                                {{ lga }}
                            </option>

                            {% endfor %}

                        {% else %}

                            <option value="">
                                Select a State First
                            </option>

                        {% endif %}

                    </select>

                </div>


                <!-- Facility -->
                <div class="col-lg-3 col-md-6 mb-3">

                    <label
                        for="facility-select"
                        class="form-label"
                    >
                        Facility
                    </label>

                    <select
                        id="facility-select"
                        name="facility"
                        class="form-select"
                    >

                        <option value="">
                            All Facilities
                        </option>

                        {% for facility in facilities %}

                        <option
                            value="{{ facility }}"
                            {% if request.args.get("facility") == facility %}
                                selected
                            {% endif %}
                        >
                            {{ facility }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- Sex -->
                <div class="col-lg-3 col-md-6 mb-3">

                    <label
                        for="sex-select"
                        class="form-label"
                    >
                        Sex
                    </label>

                    <select
                        id="sex-select"
                        name="sex"
                        class="form-select"
                    >

                        <option value="">
                            All
                        </option>

                        <option
                            value="Male"
                            {% if request.args.get("sex") == "Male" %}
                                selected
                            {% endif %}
                        >
                            Male
                        </option>

                        <option
                            value="Female"
                            {% if request.args.get("sex") == "Female" %}
                                selected
                            {% endif %}
                        >
                            Female
                        </option>

                    </select>

                </div>

            </div>


            <!-- Second row of filters -->
            <div class="row">

                <!-- Cause of Death -->
                <div class="col-lg-3 col-md-6 mb-3">

                    <label
                        for="cause-select"
                        class="form-label"
                    >
                        Cause of Death
                    </label>

                    <select
                        id="cause-select"
                        name="cause"
                        class="form-select"
                    >

                        <option value="">
                            All Causes
                        </option>

                        {% for cause in causes %}

                        <option
                            value="{{ cause }}"
                            {% if request.args.get("cause") == cause %}
                                selected
                            {% endif %}
                        >
                            {{ cause }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- Interview Year -->
                <div class="col-lg-3 col-md-6 mb-3">

                    <label
                        for="year-select"
                        class="form-label"
                    >
                        Interview Year
                    </label>

                    <select
                        id="year-select"
                        name="year"
                        class="form-select"
                    >

                        <option value="">
                            All Years
                        </option>

                        {% for year in years %}

                        <option
                            value="{{ year }}"
                            {% if request.args.get("year") == year|string %}
                                selected
                            {% endif %}
                        >
                            {{ year }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- Patient ID -->
                <div class="col-lg-3 col-md-6 mb-3">

                    <label
                        for="patient-input"
                        class="form-label"
                    >
                        Patient ID
                    </label>

                    <input
                        type="text"
                        id="patient-input"
                        name="patient"
                        class="form-control"
                        placeholder="Search Patient ID"
                        value="{{ request.args.get('patient', '') }}"
                    >

                </div>

            </div>


            <!-- Buttons -->
            <div class="mt-2">

                <button
                    type="submit"
                    class="btn btn-primary"
                >

                    <i class="bi bi-funnel"></i>

                    Apply Filters

                </button>


                <a
                    href="{{ url_for('dashboard.records') }}"
                    class="btn btn-secondary"
                >

                    <i class="bi bi-arrow-counterclockwise"></i>

                    Reset

                </a>

            </div>

        </form>

    </div>

</div>
