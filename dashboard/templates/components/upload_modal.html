
<div
    class="modal fade"
    id="uploadModal"
    tabindex="-1"
    aria-labelledby="uploadModalLabel"
    aria-hidden="true"
>

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="uploadModalLabel"
                >
                    Upload Verbal Autopsy Records
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>

            </div>


            <div class="modal-body">

                <form id="uploadForm">

                    <div class="mb-3">

                        <label
                            for="uploadFile"
                            class="form-label"
                        >
                            Select File
                        </label>

                        <input
                            type="file"
                            class="form-control"
                            id="uploadFile"
                            name="file"
                            accept=".csv,.xlsx,.xls,.json"
                        >

                    </div>


                    <div class="alert alert-info">

                        Supported formats:
                        <strong>
                            CSV, Excel, JSON
                        </strong>

                    </div>


                    <div id="uploadMessage"></div>

                </form>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    Cancel
                </button>

                <button
                    type="button"
                    class="btn btn-warning"
                    id="uploadButton"
                >
                    Upload
                </button>

            </div>

        </div>

    </div>

</div>
