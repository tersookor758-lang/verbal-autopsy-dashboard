<div class="card shadow-sm border-0 mb-4">

    <div class="card-body">

        <div class="d-flex flex-wrap justify-content-between align-items-center">

            <div>

                <h5 class="mb-1">
                    Upload Records
                </h5>

                <p class="text-muted mb-0">
                    Import new Verbal Autopsy records from CSV, Excel, or JSON files.
                </p>

            </div>


            <div class="mt-3 mt-md-0">

                <button
                    type="button"
                    class="btn btn-warning"
                    data-bs-toggle="modal"
                    data-bs-target="#uploadModal"
                >
                    Upload File
                </button>

            </div>

        </div>

    </div>

</div>



<div
    class="modal fade"
    id="uploadModal"
    tabindex="-1"
    aria-labelledby="uploadModalLabel"
    aria-hidden="true"
>

    <div class="modal-dialog">

        <div class="modal-content">


            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="uploadModalLabel"
                >
                    Upload Verbal Autopsy Records
                </h5>


                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>

            </div>



            <div class="modal-body">


                <form id="uploadForm">


                    <div class="mb-3">

                        <label
                            for="uploadFile"
                            class="form-label"
                        >
                            Select File
                        </label>


                        <input
                            type="file"
                            class="form-control"
                            id="uploadFile"
                            name="file"
                            accept=".csv,.xlsx,.xls,.json"
                        >

                    </div>



                    <div class="alert alert-info">

                        Supported formats:
                        <strong>
                            CSV, Excel, JSON
                        </strong>

                    </div>



                    <div
                        id="uploadMessage"
                    ></div>


                </form>


            </div>



            <div class="modal-footer">


                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    Cancel
                </button>


                <button
                    type="button"
                    class="btn btn-warning"
                    id="uploadButton"
                >
                    Upload
                </button>


            </div>


        </div>

    </div>

</div>
