<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>

        {% block title %}

            Verbal Autopsy Dashboard

        {% endblock %}

    </title>


    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- Project CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/dashboard.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/tables.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/forms.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/charts.css') }}"
    >


    {% block styles %}
    {% endblock %}

</head>


<body>


<nav class="navbar navbar-expand-lg">

    <div class="container-fluid">

        <a
            class="navbar-brand"
            href="{{ url_for('dashboard.index') }}"
        >

            <i class="bi bi-bar-chart-fill"></i>

            Verbal Autopsy Outcome Dashboard

        </a>

    </div>

</nav>



<div class="container-fluid mt-4">

    {% block content %}
    {% endblock %}

</div>



<footer>

    Verbal Autopsy Outcome Dashboard &copy; 2026

</footer>



<!-- Bootstrap JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>



<!-- Chart.js -->

<script
    src="https://cdn.jsdelivr.net/npm/chart.js"
></script>



<!-- Page-specific variables -->
<!-- Must load before charts.js -->

{% block scripts %}
{% endblock %}



<!-- Project JavaScript -->

<script
    src="{{ url_for('static', filename='js/charts.js') }}"
></script>

<script
    src="{{ url_for('static', filename='js/dashboard.js') }}"
></script>

<script
    src="{{ url_for('static', filename='js/upload.js') }}"
></script>


</body>

</html>
