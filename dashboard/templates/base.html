<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            Verbal Autopsy Dashboard
        {% endblock %}
    </title>


    <!-- Restore saved theme before page loads -->

    <script>

        const savedTheme = localStorage.getItem("theme");

        if (savedTheme) {

            document.documentElement.setAttribute(
                "data-theme",
                savedTheme
            );

        }

    </script>


    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- Project CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/dashboard.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/tables.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/forms.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/charts.css') }}"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/dark-mode.css') }}"
    >


    {% block styles %}
    {% endblock %}

</head>


<body>


    <!-- Navigation -->

    <nav class="navbar navbar-expand-lg">

        <div class="container-fluid">

            <a
                class="navbar-brand"
                href="{{ url_for('dashboard.index') }}"
            >

                <i class="bi bi-bar-chart-fill"></i>

                VA Dashboard

            </a>


            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav"
                aria-controls="navbarNav"
                aria-expanded="false"
                aria-label="Toggle navigation"
            >

                <span class="navbar-toggler-icon"></span>

            </button>


            <div
                class="collapse navbar-collapse"
                id="navbarNav"
            >

                <ul class="navbar-nav ms-4">


                    <!-- Dashboard -->

                    <li class="nav-item">

                        <a
                            class="nav-link {% if request.endpoint == 'dashboard.index' %}active{% endif %}"
                            href="{{ url_for('dashboard.index') }}"
                        >
                            Dashboard
                        </a>

                    </li>


                    <!-- Records -->

                    <li class="nav-item">

                        <a
                            class="nav-link {% if request.endpoint == 'dashboard.records' %}active{% endif %}"
                            href="{{ url_for('dashboard.records') }}"
                        >
                            Records
                        </a>

                    </li>


                    <!-- Analytics -->

                    <li class="nav-item">

                        <a
                            class="nav-link {% if request.endpoint == 'dashboard.analytics' %}active{% endif %}"
                            href="{{ url_for('dashboard.analytics') }}"
                        >
                            Analytics
                        </a>

                    </li>


                    <!-- Reports -->

                    <li class="nav-item">

                        <a
                            class="nav-link {% if request.endpoint == 'dashboard.reports' %}active{% endif %}"
                            href="{{ url_for('dashboard.reports') }}"
                        >
                            Reports
                        </a>

                    </li>

                </ul>


                <!-- Theme Toggle -->

                <div class="ms-auto">

                    <button
                        id="themeToggle"
                        class="btn btn-light"
                        type="button"
                        aria-label="Toggle dark mode"
                    >

                        <i
                            id="themeIcon"
                            class="bi bi-moon-fill"
                        ></i>

                    </button>

                </div>

            </div>

        </div>

    </nav>


    <!-- Main Content -->

    <main class="container-fluid py-4">

        {% block content %}
        {% endblock %}

    </main>


    <!-- Footer -->

    <footer class="text-center py-3">

        Verbal Autopsy Outcome Dashboard
        &copy; 2026

    </footer>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- Chart.js -->

    <script
        src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"
    ></script>


    <!-- Project JavaScript -->

    <script
        src="{{ url_for('static', filename='js/dashboard.js') }}"
    ></script>

    <script
        src="{{ url_for('static', filename='js/filters.js') }}"
    ></script>

    <script
        src="{{ url_for('static', filename='js/upload.js') }}"
    ></script>

    <script
        src="{{ url_for('static', filename='js/export.js') }}"
    ></script>


    {% block scripts %}
    {% endblock %}

</body>

</html>
