<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Verbal Autopsy Dashboard
        {% endblock %}
    </title>

    <!-- Restore saved theme before page loads -->
    <script>

        const savedTheme = localStorage.getItem("theme");

        if (savedTheme) {

            document.documentElement.setAttribute("data-theme", savedTheme);

        }

    </script>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Project CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tables.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/charts.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dark-mode.css') }}">

    {% block styles %}
    {% endblock %}

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container-fluid">

        <a
            class="navbar-brand"
            href="{{ url_for('dashboard.index') }}"
        >

            <i class="bi bi-bar-chart-fill"></i>

            VA Dashboard

        </a>

        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
        >

            <span class="navbar-toggler-icon"></span>

        </button>

        <div
            class="collapse navbar-collapse"
            id="navbarNav"
        >

            <ul class="navbar-nav ms-4">

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{{ url_for('dashboard.index') }}"
                    >
                        Dashboard
                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{{ url_for('dashboard.records') }}"
                    >
                        Records
                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{{ url_for('dashboard.analytics') }}"
                    >
                        Analytics
                    </a>

                </li>

                <li class="nav-item">

                    <a
                        class="nav-link"
                        href="{{ url_for('dashboard.reports') }}"
                    >
                        Reports
                    </a>

                </li>

            </ul>

            <div class="ms-auto">

                <button
                    id="themeToggle"
                    class="btn btn-light"
                    type="button"
                >

                    <i id="themeIcon" class="bi bi-moon-fill"></i>

                </button>

            </div>

        </div>

    </div>

</nav>


<div class="container-fluid mt-4">

    {% block content %}
    {% endblock %}

</div>


<footer>

    Verbal Autopsy Outcome Dashboard &copy; 2026

</footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

{% block scripts %}
{% endblock %}

<script src="{{ url_for('static', filename='js/charts.js') }}"></script>
<script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
<script src="{{ url_for('static', filename='js/upload.js') }}"></script>

<script>

document.addEventListener("DOMContentLoaded", () => {

    const button = document.getElementById("themeToggle");
    const icon = document.getElementById("themeIcon");

    function applyTheme(theme) {

        document.documentElement.setAttribute("data-theme", theme);

        localStorage.setItem("theme", theme);

        icon.className = theme === "dark"
            ? "bi bi-sun-fill"
            : "bi bi-moon-fill";

    }

    let currentTheme = localStorage.getItem("theme") || "light";

    applyTheme(currentTheme);

    button.addEventListener("click", () => {

        currentTheme = currentTheme === "light"
            ? "dark"
            : "light";

        applyTheme(currentTheme);

        if (window.renderDashboardCharts) {

            window.renderDashboardCharts();

        }

    });

});

</script>

</body>

</html>
