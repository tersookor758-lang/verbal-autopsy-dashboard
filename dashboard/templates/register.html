{% extends "base.html" %}

{% block title %}
Register
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6 col-lg-5">

        <div class="card shadow-sm border-0">

            <div class="card-body p-4">

                <div class="text-center mb-4">

                    <i class="bi bi-person-plus-fill fs-1"></i>

                    <h3 class="fw-bold mt-2">
                        Create Account
                    </h3>

                    <p class="text-muted">
                        Register for the Verbal Autopsy Dashboard.
                    </p>

                </div>


                <form
                    method="POST"
                    action="{{ url_for('auth.register') }}"
                >

                    <!-- Username -->

                    <div class="mb-3">

                        <label
                            for="username"
                            class="form-label"
                        >
                            Username
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            name="username"
                            required
                            autocomplete="username"
                        >

                    </div>


                    <!-- Email -->

                    <div class="mb-3">

                        <label
                            for="email"
                            class="form-label"
                        >
                            Email Address
                        </label>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            required
                            autocomplete="email"
                        >

                    </div>


                    <!-- Password -->

                    <div class="mb-3">

                        <label
                            for="password"
                            class="form-label"
                        >
                            Password
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            required
                            autocomplete="new-password"
                        >

                    </div>


                    <!-- Confirm Password -->

                    <div class="mb-4">

                        <label
                            for="confirm_password"
                            class="form-label"
                        >
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            id="confirm_password"
                            name="confirm_password"
                            required
                            autocomplete="new-password"
                        >

                    </div>


                    <!-- Submit -->

                    <button
                        type="submit"
                        class="btn btn-primary w-100"
                    >

                        <i class="bi bi-person-plus"></i>

                        Create Account

                    </button>

                </form>


                <div class="text-center mt-4">

                    <span class="text-muted">
                        Already have an account?
                    </span>

                    <a
                        href="{{ url_for('auth.login') }}"
                        class="text-decoration-none"
                    >
                        Login
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
